<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏎️ Моя гонка</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 15px 0 5px;
}

#info {
    font-size: 20px;
    margin: 10px;
}

canvas {
    display: block;
    margin: auto;
    width: 95vw;
    max-width: 400px;
    height: auto;
    background: #333;
    border: 4px solid white;
}

button {
    border: none;
    border-radius: 12px;
    padding: 12px 25px;
    margin: 7px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

#start {
    background: #00c853;
    color: white;
}

.control {
    background: #2196f3;
    color: white;
    width: 100px;
    height: 60px;
    font-size: 28px;
}
</style>
</head>

<body>

<h1>🏎️ МОЯ ГОНКА 🏁</h1>

<div id="info">
    Очки: <span id="score">0</span>
    &nbsp; | &nbsp;
    Скорость: <span id="speed">1</span>
</div>

<canvas id="game" width="400" height="600"></canvas>

<button id="start">▶ НАЧАТЬ ИГРУ</button>

<div>
    <button class="control" id="left">⬅️</button>
    <button class="control" id="right">➡️</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const speedText = document.getElementById("speed");
const startButton = document.getElementById("start");

let player;
let enemies = [];
let score = 0;
let speed = 4;
let running = false;
let roadLine = 0;
let animationId;

function resetGame() {
    player = {
        x: 180,
        y: 500,
        width: 40,
        height: 70
    };

    enemies = [];
    score = 0;
    speed = 4;
    roadLine = 0;

    scoreText.textContent = "0";
    speedText.textContent = "1";
}

function drawRoad() {
    // Трава
    ctx.fillStyle = "#16802b";
    ctx.fillRect(0, 0, 400, 600);

    // Дорога
    ctx.fillStyle = "#444";
    ctx.fillRect(50, 0, 300, 600);

    // Края
    ctx.fillStyle = "white";
    ctx.fillRect(50, 0, 5, 600);
    ctx.fillRect(345, 0, 5, 600);

    // Разметка
    ctx.fillStyle = "white";

    roadLine += speed;

    if (roadLine >= 80) {
        roadLine = 0;
    }

    for (let y = -80 + roadLine; y < 600; y += 80) {
        ctx.fillRect(145, y, 8, 45);
        ctx.fillRect(247, y, 8, 45);
    }
}

function drawCar(car, color) {
    // Корпус
    ctx.fillStyle = color;
    ctx.fillRect(
        car.x,
        car.y,
        car.width,
        car.height
    );

    // Стекло
    ctx.fillStyle = "#87ceeb";
    ctx.fillRect(
        car.x + 7,
        car.y + 10,
        26,
        20
    );

    // Колёса
    ctx.fillStyle = "#000";

    ctx.fillRect(car.x - 5, car.y + 10, 5, 18);
    ctx.fillRect(car.x + 40, car.y + 10, 5, 18);

    ctx.fillRect(car.x - 5, car.y + 45, 5, 18);
    ctx.fillRect(car.x + 40, car.y + 45, 5, 18);
}

function createEnemy() {
    const lanes = [75, 128, 180, 232, 285];

    const lane =
        lanes[Math.floor(Math.random() * lanes.length)];

    enemies.push({
        x: lane,
        y: -80,
        width: 40,
        height: 70,
        color: Math.random() > 0.5
            ? "#2196f3"
            : "#ffeb3b"
    });
}

function collision(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

function moveEnemies() {
    for (let enemy of enemies) {
        enemy.y += speed;

        drawCar(enemy, enemy.color);

        if (collision(player, enemy)) {
            gameOver();
            return;
        }
    }

    enemies = enemies.filter(enemy => {
        if (enemy.y > 600) {
            score++;

            scoreText.textContent = score;

            if (score % 5 === 0) {
                speed += 0.5;
                speedText.textContent =
                    Math.floor(speed / 2);
            }

            return false;
        }

        return true;
    });
}
function moveLeft() {
    if (!running) return;

    player.x -= 35;

    if (player.x < 55) {
        player.x = 55;
    }
}

function moveRight() {
    if (!running) return;

    player.x += 35;

    if (player.x > 305) {
        player.x = 305;
    }
}

function gameLoop() {
    if (!running) return;

    ctx.clearRect(0, 0, 400, 600);

    drawRoad();

    drawCar(player, "#f44336");

    moveEnemies();

    if (Math.random() < 0.025) {
        createEnemy();
    }

    animationId = requestAnimationFrame(gameLoop);
}

function startGame() {
    cancelAnimationFrame(animationId);

    resetGame();

    running = true;

    startButton.textContent = "🔄 ЗАНОВО";

    gameLoop();
}

function gameOver() {
    running = false;

    cancelAnimationFrame(animationId);

    setTimeout(() => {
        alert(
            "💥 АВАРИЯ!\n\n" +
            "Твои очки: " + score
        );
    }, 100);
}

startButton.addEventListener("click", startGame);

document.getElementById("left")
    .addEventListener("click", moveLeft);

document.getElementById("right")
    .addEventListener("click", moveRight);

document.addEventListener("keydown", function(event) {
    if (event.key === "ArrowLeft" || event.key === "a") {
        moveLeft();
    }

    if (event.key === "ArrowRight" || event.key === "d") {
        moveRight();
    }
});

resetGame();
</script>

</body>
</html>
