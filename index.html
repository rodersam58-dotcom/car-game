<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моя гонка 🏎️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 12px 0 5px;
}

#info {
    font-size: 20px;
    margin: 8px;
}

canvas {
    width: 95vw;
    max-width: 400px;
    height: auto;
    border: 4px solid white;
    background: #333;
    display: block;
    margin: auto;
}

button {
    border: none;
    border-radius: 12px;
    padding: 12px 22px;
    margin: 6px;
    font-size: 18px;
    font-weight: bold;
}

#start {
    background: #00c853;
    color: white;
}

.control {
    background: #2196f3;
    color: white;
    width: 90px;
    height: 55px;
    font-size: 25px;
}
</style>
</head>

<body>

<h1>🏎️ МОЯ ГОНКА 🏁</h1>

<div id="info">
    Очки: <span id="score">0</span>
    |
    Скорость: <span id="speed">1</span>
</div>

<canvas id="game" width="400" height="600"></canvas>

<button id="start" onclick="startGame()">▶ НАЧАТЬ ИГРУ</button>

<div>
    <button class="control" onclick="moveLeft()">⬅️</button>
    <button class="control" onclick="moveRight()">➡️</button>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player;
let enemies = [];
let score = 0;
let gameSpeed = 4;
let gameRunning = false;
let roadOffset = 0;
let animation;
let targetX = 180;

function resetGame() {

    player = {
        x: 180,
        y: 500,
        width: 40,
        height: 70
    };

    targetX = 180;

    enemies = [];
    score = 0;
    gameSpeed = 4;
    roadOffset = 0;

    document.getElementById("score").textContent = "0";
    document.getElementById("speed").textContent = "1";
}

function drawRoad() {

    ctx.fillStyle = "#16802b";
    ctx.fillRect(0, 0, 400, 600);

    ctx.fillStyle = "#444";
    ctx.fillRect(50, 0, 300, 600);

    ctx.fillStyle = "white";

    ctx.fillRect(50, 0, 5, 600);
    ctx.fillRect(345, 0, 5, 600);

    ctx.fillStyle = "white";

    roadOffset += gameSpeed;

    if (roadOffset > 80) {
        roadOffset = 0;
    }

    for (
        let y = -80 + roadOffset;
        y < 600;
        y += 80
    ) {

        ctx.fillRect(108, y, 8, 45);
        ctx.fillRect(166, y, 8, 45);
        ctx.fillRect(224, y, 8, 45);
        ctx.fillRect(282, y, 8, 45);
    }
}

function drawCar(car, color) {

    ctx.fillStyle = color;

    ctx.fillRect(
        car.x,
        car.y,
        car.width,
        car.height
    );

    ctx.fillStyle = "#87ceeb";

    ctx.fillRect(
        car.x + 7,
        car.y + 10,
        26,
        20
    );

    ctx.fillStyle = "black";

    ctx.fillRect(
        car.x - 5,
        car.y + 10,
        5,
        18
    );

    ctx.fillRect(
        car.x + 40,
        car.y + 10,
        5,
        18
    );

    ctx.fillRect(
        car.x - 5,
        car.y + 45,
        5,
        18
    );

    ctx.fillRect(
        car.x + 40,
        car.y + 45,
        5,
        18
    );
}

function createEnemy() {

    const lanes = [
        58,
        116,
        174,
        232,
        290
    ];

    const lane =
        Math.floor(Math.random() * lanes.length);

    const x = lanes[lane];

    for (let enemy of enemies) {

        if (
            enemy.y < 180 &&
            enemy.x === x
        ) {
            return;
        }
    }

    enemies.push({

        x: x,
        y: -80,
        width: 40,
        height: 70,

        color:
            Math.random() > 0.5
            ? "#2196f3"
            : "#ffeb3b"
    });
}

function collision(a, b) {

    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

function moveEnemies() {

    for (let enemy of enemies) {

        enemy.y += gameSpeed;

        drawCar(
            enemy,
            enemy.color
        );

        if (collision(player, enemy)) {
            gameOver();
        }
    }

    enemies = enemies.filter(enemy => {

        if (enemy.y > 600) {

            score++;

            document.getElementById("score")
                .textContent = score;

            if (score % 5 === 0) {

                gameSpeed += 0.5;

                document.getElementById("speed")
                    .textContent =
                    Math.floor(gameSpeed / 2);
            }

            return false;
        }

        return true;
    });
}

function moveLeft() {

    if (!gameRunning) return;

    targetX -= 35;

    if (targetX < 55) {
        targetX = 55;
    }
}

function moveRight() {

    if (!gameRunning) return;

    targetX += 35;

    if (targetX > 305) {
        targetX = 305;
    }
}

function smoothPlayerMovement() {

    player.x +=
        (targetX - player.x) * 0.12;
}

function gameLoop() {

    if (!gameRunning) return;

    ctx.clearRect(
        0,
        0,
        400,
        600
    );

    drawRoad();

    smoothPlayerMovement();

    drawCar(
        player,
        "#f44336"
    );

    moveEnemies();

    if (Math.random() < 0.018) {
        createEnemy();
    }

    animation =
        requestAnimationFrame(gameLoop);
}

function startGame() {

    cancelAnimationFrame(animation);

    resetGame();

    gameRunning = true;

    document.getElementById("start")
        .textContent = "🔄 ЗАНОВО";

    gameLoop();
}

function gameOver() {

    gameRunning = false;

    cancelAnimationFrame(animation);

    setTimeout(() => {

        alert(
            "💥 АВАРИЯ!\n\n" +
            "Твои очки: " + score
        );

    }, 100);
}

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowLeft" ||
            event.key === "a"
        ) {
            moveLeft();
        }

        if (
            event.key === "ArrowRight" ||
            event.key === "d"
        ) {
            moveRight();
        }
    }
);

resetGame();

</script>

</body>
</html>
