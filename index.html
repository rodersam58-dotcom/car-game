<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ЭТО МОЙ ПЕРВЫЙ САЙТ</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    text-align: center;
}

header {
    background: #222;
    color: white;
    padding: 30px 15px;
}

h1 {
    margin: 0 0 20px;
}

.search {
    display: flex;
    justify-content: center;
    gap: 10px;
}

input {
    width: 60%;
    max-width: 500px;
    padding: 14px;
    font-size: 17px;
    border: none;
    border-radius: 8px;
}

button {
    padding: 14px 20px;
    font-size: 17px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #ddd;
}

#results {
    max-width: 800px;
    margin: 30px auto;
    padding: 0 15px;
}

.result {
    background: white;
    margin: 20px 0;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.result h2 {
    margin-top: 0;
}

.result img {
    max-width: 100%;
    width: 500px;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>

<h1>ЭТО МОЙ ПЕРВЫЙ САЙТ</h1>

<div class="search">
    <input id="searchInput" type="text" placeholder="Что хотите найти?">
    <button onclick="search()">Поиск</button>
</div>

</header>


<div id="results"></div>


<script>

const pages = [
    {
        title: "Моё фото",
        text: "Фотография 6022954",
        image: "6022954_15.jpg"
    }
];


function showVideos(list) {

    const results = document.getElementById("results");

    results.innerHTML = list.map(page => `

        <div class="result">

            <h2>${page.title}</h2>

            <p>${page.text}</p>

            ${page.image ? `
                <img src="${page.image}" alt="${page.title}">
            ` : ""}

        </div>

    `).join("");
}


function search() {

    const query = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    if (query === "") {
        showVideos(pages);
        return;
    }


    const found = pages.filter(page =>
        page.title.toLowerCase().includes(query) ||
        page.text.toLowerCase().includes(query)
    );


    if (found.length === 0) {

        document.getElementById("results").innerHTML =
            "<h2>Ничего не найдено</h2>";

        return;
    }


    showVideos(found);
}


document
    .getElementById("searchInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            search();
        }

    });


showVideos(pages);

</script>

</body>
</html>
